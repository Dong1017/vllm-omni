# MiniMax-H3 Ref2VA: three stages sharing one 8-GPU host.
base_config: ../../../vllm_omni/deploy/minimax_h3_disaggregated_decode.yaml

connectors:
  local:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    devices: "0,1,2,3,4,5,6,7"
    tensor_parallel_size: 8
    output_connectors: {to_stage_1: local}

  - stage_id: 1
    devices: "0,1,2,3,4,5,6,7"
    input_connectors: {from_stage_0: local}
    output_connectors: {to_stage_2: local}
    dlo_use_allgather: true
    parallel_config:
      tensor_parallel_size: 1
      ulysses_degree: 4
      ring_degree: 2
      vae_patch_parallel_size: 1

  - stage_id: 2
    devices: "0,1,2,3,4,5,6,7"
    input_connectors: {from_stage_1: local}
    parallel_config:
      tensor_parallel_size: 1
      ulysses_degree: 8
      vae_patch_parallel_size: 8
