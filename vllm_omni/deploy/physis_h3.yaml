pipeline: physis_h3
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    vae_use_tiling: true
    model_class_name: PhysisH3Pipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    parallel_config:
      pipeline_parallel_size: 1
    model_config:
      num_denoise_steps: 4
      ar_diffusion_stage_config:
        stage_parallel_size: 1
        max_batch_size: 1
        max_history_chunks: 18

